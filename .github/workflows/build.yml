# Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile iOS app -> .ipa (ghnew)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build for iOS device (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ghnew.xcodeproj -scheme ghnew -configuration Debug \
            -destination 'generic/platform=iOS' -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project ghnew.xcodeproj -scheme ghnew -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ./build-sim \
            CODE_SIGNING_ALLOWED=NO build

      - name: Package device .ipa
        run: |
          mkdir -p ./release-device/Payload
          cp -R ./build/Build/Products/Debug-iphoneos/ghnew.app ./release-device/Payload/
          cd ./release-device && zip -qr ghnew-device-unsigned.ipa Payload

      - name: Package simulator .ipa
        run: |
          mkdir -p ./release-sim/Payload
          cp -R ./build-sim/Build/Products/Debug-iphonesimulator/ghnew.app ./release-sim/Payload/
          cd ./release-sim && zip -qr ghnew-simulator.ipa Payload

      - name: Build for macOS
        run: |
          set -o pipefail
          xcodebuild -project ghnew.xcodeproj -scheme ghnew -configuration Debug \
            -destination 'generic/platform=macOS' -derivedDataPath ./build-mac \
            CODE_SIGNING_ALLOWED=NO build

      - name: Package macOS app
        run: |
          mkdir -p ./release-mac
          cp -R ./build-mac/Build/Products/Debug/ghnew.app ./release-mac/
          cd ./release-mac && zip -qr ghnew-macos.app.zip ghnew.app

      - name: Upload device .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghnew-device-unsigned-ipa
          path: release-device/ghnew-device-unsigned.ipa
          if-no-files-found: warn

      - name: Upload simulator .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghnew-simulator-ipa
          path: release-sim/ghnew-simulator.ipa
          if-no-files-found: warn

      - name: Upload macOS .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghnew-macos.zip
          path: release-mac/ghnew-macos.app.zip
          if-no-files-found: warn