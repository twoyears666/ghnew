# Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile iOS app -> .ipa (ghnew)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build for iOS device (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ghnew.xcodeproj -scheme ghnew -configuration Debug \
            -destination 'generic/platform=iOS' -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project ghnew.xcodeproj -scheme ghnew -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ./build-sim \
            CODE_SIGNING_ALLOWED=NO build

      - name: Package device .ipa
        run: |
          mkdir -p ./release-device/Payload
          cp -R ./build/Build/Products/Debug-iphoneos/ghnew.app ./release-device/Payload/
          cd ./release-device && zip -qr ghnew-device-unsigned.ipa Payload

      - name: Package simulator .ipa
        run: |
          mkdir -p ./release-sim/Payload
          cp -R ./build-sim/Build/Products/Debug-iphonesimulator/ghnew.app ./release-sim/Payload/
          cd ./release-sim && zip -qr ghnew-simulator.ipa Payload

      - name: Build for macOS
        run: |
          set -o pipefail
          xcodebuild -project ghnew.xcodeproj -scheme ghnew -configuration Debug \
            -destination 'generic/platform=macOS' -derivedDataPath ./build-mac \
            CODE_SIGNING_ALLOWED=NO build

      - name: Package macOS app
        run: |
          mkdir -p ./release-mac
          cp -R ./build-mac/Build/Products/Debug/ghnew.app ./release-mac/
          cd ./release-mac && zip -qr ghnew-macos.app.zip ghnew.app

      - name: Upload device .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghnew-device-unsigned-ipa
          path: release-device/ghnew-device-unsigned.ipa
          if-no-files-found: warn

      - name: Upload simulator .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghnew-simulator-ipa
          path: release-sim/ghnew-simulator.ipa
          if-no-files-found: warn

      - name: Upload macOS .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghnew-macos.zip
          path: release-mac/ghnew-macos.app.zip
          if-no-files-found: warn

  apk:
    name: Build Android APK (flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK
        run: |
          set -o pipefail
          cd flutter_android
          # Generate the full android/ scaffolding from the installed Flutter SDK
          # (ensures the Gradle wrapper, settings and AGP resolution match), then
          # overlay our custom identity files (namespace, deep-link manifest,
          # MainActivity, res). Hand-written gradle configs are not exposed to AGP
          # version drift this way.
          scratch="$(mktemp -d)"
          (
            cd "$scratch"
            flutter create --project-name ghnew_android --org com.twoyears666 --platforms=android . >/dev/null
          )
          rm -rf android
          cp -R "$scratch/android" android
          rm -rf android/app/src/main/kotlin/com/twoyears666/ghnew_android
          cp -R android_overlay/. android/
          chmod +x android/gradlew
          flutter pub get
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghnew-android.apk
          path: flutter_android/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn

  windows:
    name: Build Windows desktop (flutter)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Windows
        run: |
          cd flutter_android
          # Scaffold the Windows runner (adds windows/ without touching the
          # custom android/ folder), then build the desktop app.
          flutter create --platforms=windows --project-name ghnew_android --org com.twoyears666 .
          flutter pub get
          flutter build windows --release

      - name: Package Windows app
        shell: pwsh
        run: |
          Compress-Archive -Path "flutter_android\build\windows\x64\runner\Release\*" -DestinationPath "ghnew-windows.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghnew-windows.zip
          path: ghnew-windows.zip
          if-no-files-found: warn